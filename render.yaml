services:
  - type: web
    name: catv-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: catv-database
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: /var/data/catv.sqlite
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/cache
      - key: STORAGE_DRIVER
        value: r2
      - key: TRUST_PROXY
        value: "true"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_MUTATION_ALLOWED_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: STRAIGHT_MAP_PIPELINE_V2_ENABLED
        value: "true"
      - key: STRAIGHT_MAP_RENDERER_DEVICE_TOKEN
        sync: false
      - key: STRAIGHT_MAP_TARGET_DPI
        value: "1100"
      - key: STRAIGHT_MAP_TILE_SIZE
        value: "512"
      - key: STRAIGHT_MAP_WEBP_QUALITY
        value: "94"
      - key: STRAIGHT_MAP_WEBP_EFFORT
        value: "2"
      - key: STRAIGHT_MAP_TILE_CONCURRENCY
        value: "2"
      - key: STRAIGHT_MAP_UPLOAD_CONCURRENCY
        value: "6"
      - key: STRAIGHT_MAP_DIRECT_R2_UPLOAD_ENABLED
        value: "false"
